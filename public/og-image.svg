<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">RedactPDF — Client-side PDF redaction in your browser</title>
  <desc id="og-desc">RedactPDF sanitizes PDF and text content locally in the browser with zero tracking cookies and no cloud uploads.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <path d="M0 140H1200M0 280H1200M0 420H1200M0 560H1200"/>
    <path d="M140 0V630M380 0V630M620 0V630M860 0V630M1100 0V630"/>
  </g>

  <g transform="translate(80 74)">
