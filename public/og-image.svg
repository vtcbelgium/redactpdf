    <path d="M22 10l10 4v8c0 7-4.5 11.5-10 14-5.5-2.5-10-7-10-14v-8l10-4z" fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M17 22l3.5 3.5L28 18" fill="none" stroke="#e0f2fe" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="140" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#94a3b8" letter-spacing="2">OTHRYS SOVEREIGN FLEET</text>

  <text x="80" y="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="#f8fafc" letter-spacing="-2">RedactPDF</text>
  <text x="82" y="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#cbd5e1">Sanitize PDFs and text in your browser.</text>
  <text x="82" y="398" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#64748b">Email, phone, national ID, payment data and API key redaction.</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <g transform="translate(82 470)">
