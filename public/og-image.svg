    </g>
    <g transform="translate(370 470)">
      <rect width="300" height="52" rx="26" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="30" cy="26" r="6" fill="#22d3ee"/>
      <text x="48" y="34" fill="#e2e8f0">Zero Tracking Cookies</text>
    </g>
    <g transform="translate(690 470)">
